media:
  - name: images
    label: Fotos da ML Store
    input: media/images
    output: /media/images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]
    categories: [image]
content:
  - name: site
    label: Conteúdo e identidade do site
    type: file
    path: data/site.json
    format: json
    fields:
      - name: brand_name
        label: Nome da marca
        type: string
      - name: logo_image
        label: Logo da ML Store
        type: image
        options:
          media: images
      - name: instagram
        label: Link do Instagram
        type: string
      - name: whatsapp
        label: WhatsApp com DDI e DDD, somente números
        type: string
      - name: hero_image
        label: Foto principal do topo
        type: image
        options:
          media: images
      - name: hero_position
        label: Enquadramento da foto do topo
        type: select
        options:
          values: ["center center", "left center", "right center", "center top", "center bottom", "left top", "right top", "left bottom", "right bottom"]
      - name: hero_kicker
        label: Chamada pequena do topo
        type: string
      - name: hero_line1
        label: Título principal, linha 1
        type: string
      - name: hero_line2
        label: Título principal, linha 2
        type: string
      - name: hero_description
        label: Texto de apresentação
        type: text
      - name: ticker_text
        label: FRASE DA FAIXA HORIZONTAL DESLIZANTE (EDITE AQUI)
        type: string
      - name: about_image
        label: Foto da seção A marca
        type: image
        options:
          media: images
      - name: about_position
        label: Enquadramento da foto A marca
        type: select
        options:
          values: ["center center", "left center", "right center", "center top", "center bottom", "left top", "right top", "left bottom", "right bottom"]
      - name: about_layout
        label: Posição da foto na seção A marca
        type: select
        options:
          values:
            - name: image-left
              label: Foto à esquerda
            - name: image-right
              label: Foto à direita
      - name: about_tag
        label: Frase sobre a foto (pode deixar vazio)
        type: string
      - name: about_kicker
        label: Chamada da seção A marca
        type: string
      - name: about_title
        label: Título da seção A marca
        type: string
      - name: about_text1
        label: Primeiro parágrafo da marca
        type: text
      - name: about_text2
        label: Segundo parágrafo da marca
        type: text
      - name: manifesto_image
        label: Foto de fundo do manifesto
        type: image
        options:
          media: images
      - name: manifesto_position
        label: Enquadramento do manifesto
        type: select
        options:
          values: ["center center", "left center", "right center", "center top", "center bottom", "left top", "right top", "left bottom", "right bottom"]
      - name: manifesto_kicker
        label: Chamada do manifesto
        type: string
      - name: manifesto_title
        label: Título do manifesto
        type: string
      - name: manifesto_text
        label: Texto do manifesto
        type: text
      - name: gallery_kicker
        label: Chamada da galeria
        type: string
      - name: gallery_title
        label: Título da galeria
        type: string
      - name: gallery_description
        label: Descrição da galeria
        type: text
      - name: carousel_phrase
        label: TÍTULO DA COLEÇÃO: EDITE O NOME DO MÊS E A FRASE
        type: string
      - name: interlude_title
        label: TÍTULO DA FAIXA PRETA APÓS DIVERSIFICANDO MODELOS
        type: string
      - name: contact_kicker
        label: Chamada do contato
        type: string
      - name: contact_title
        label: Título do contato
        type: string
      - name: contact_description
        label: Texto do contato
        type: text
      - name: footer_description
        label: Texto do rodapé
        type: text

  - name: gallery
    label: Fotos da galeria
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: title
        label: Legenda da foto
        type: string
      - name: image
        label: Foto
        type: image
        options:
          media: images

  - name: carousel
    label: COLEÇÃO DE DEZEMBRO: ESCOLHER ATÉ 10 FOTOS NOVAS
    type: file
    path: data/carousel.json
    format: json
    list: true
    fields:
      - name: title
        label: Legenda da foto (opcional)
        type: string
      - name: image
        label: TOQUE AQUI PARA ESCOLHER FOTO DA GALERIA OU ENVIAR DO CELULAR
        type: image
        required: true
        options:
          media: images
          path: media/images
          extensions: [jpg, jpeg, png, webp, avif]

  - name: interlude
    label: FOTOS NOVAS NA FAIXA PRETA APÓS DIVERSIFICANDO MODELOS: ATÉ 4
    type: file
    path: data/interlude.json
    format: json
    list: true
    fields:
      - name: title
        label: Legenda da foto (opcional)
        type: string
      - name: image
        label: TOQUE AQUI PARA ESCOLHER FOTO NOVA DO CELULAR
        type: image
        required: true
        options:
          media: images
          path: media/images
          extensions: [jpg, jpeg, png, webp, avif]

  - name: ticker
    label: EDITAR FRASES DA FAIXA DESLIZANTE
    type: file
    path: data/ticker.json
    format: json
    list: true
    fields:
      - name: text
        label: Frase exibida na faixa horizontal (edite o texto aqui)
        type: string

  - name: highlights
    label: Artes modernas de destaque
    type: file
    path: data/highlights.json
    format: json
    list: true
    fields:
      - name: kicker
        label: Texto pequeno
        type: string
      - name: title
        label: Título em destaque
        type: string
      - name: description
        label: Descrição curta
        type: text

settings:
  content:
    merge: true
