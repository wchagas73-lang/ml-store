media:
  - name: images
    label: Fotos da ML Store
    input: media/images
    output: /media/images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]
    categories: [image]

content:
  - name: site
    label: Conteúdo e identidade do site
    type: file
    path: data/site.json
    format: json
    fields:
      - name: brand_name
        label: Nome da marca
        type: string
      - name: logo_image
        label: Logo da ML Store
        type: image
        options:
          media: images
      - name: instagram
        label: Link do Instagram
        type: string
      - name: whatsapp
        label: WhatsApp com DDI e DDD, somente números
        type: string
      - name: hero_image
        label: Foto principal do topo
        type: image
        options:
          media: images
      - name: hero_position
        label: Enquadramento da foto do topo
        type: select
        options:
          values: ["center center", "left center", "right center", "center top", "center bottom", "left top", "right top", "left bottom", "right bottom"]
      - name: hero_kicker
        label: Chamada pequena do topo
        type: string
      - name: hero_line1
        label: Título principal, linha 1
        type: string
      - name: hero_line2
        label: Título principal, linha 2
        type: string
      - name: hero_description
        label: Texto de apresentação
        type: text
      - name: about_image
        label: Foto da seção A marca
        type: image
        options:
          media: images
      - name: about_position
        label: Enquadramento da foto A marca
        type: select
        options:
          values: ["center center", "left center", "right center", "center top", "center bottom", "left top", "right top", "left bottom", "right bottom"]
      - name: about_layout
        label: Posição da foto na seção A marca
        type: select
        options:
          values:
            - name: image-left
              label: Foto à esquerda
            - name: image-right
              label: Foto à direita
      - name: about_tag
        label: Frase sobre a foto
        type: string
      - name: about_kicker
        label: Chamada da seção A marca
        type: string
      - name: about_title
        label: Título da seção A marca
        type: string
      - name: about_text1
        label: Primeiro parágrafo da marca
        type: text
      - name: about_text2
        label: Segundo parágrafo da marca
        type: text
      - name: manifesto_image
        label: Foto de fundo do manifesto
        type: image
        options:
          media: images
      - name: manifesto_position
        label: Enquadramento do manifesto
        type: select
        options:
          values: ["center center", "left center", "right center", "center top", "center bottom", "left top", "right top", "left bottom", "right bottom"]
      - name: manifesto_kicker
        label: Chamada do manifesto
        type: string
      - name: manifesto_title
        label: Título do manifesto
        type: string
      - name: manifesto_text
        label: Texto do manifesto
        type: text
      - name: gallery_kicker
        label: Chamada da galeria
        type: string
      - name: gallery_title
        label: Título da galeria
        type: string
      - name: gallery_description
        label: Descrição da galeria
        type: text
      - name: video_image
        label: Foto da campanha
        type: image
        options:
          media: images
      - name: campaign_position
        label: Enquadramento da foto da campanha
        type: select
        options:
          values: ["center center", "left center", "right center", "center top", "center bottom", "left top", "right top", "left bottom", "right bottom"]
      - name: video_kicker
        label: Chamada da campanha
        type: string
      - name: video_title
        label: Título da campanha
        type: string
      - name: video_description
        label: Descrição da campanha
        type: text
      - name: contact_kicker
        label: Chamada do contato
        type: string
      - name: contact_title
        label: Título do contato
        type: string
      - name: contact_description
        label: Texto do contato
        type: text
      - name: footer_description
        label: Texto do rodapé
        type: text

  - name: gallery
    label: Fotos da galeria
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: title
        label: Legenda da foto
        type: string
      - name: image
        label: Foto
        type: image
        options:
          media: images

settings:
  content:
    merge: true
