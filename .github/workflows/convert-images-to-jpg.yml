name: Padronizar imagens cadastradas em JPG

on:
  push:
    branches: [main]
    paths:
      - "scripts/convert_images_to_jpg.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-images-to-jpg
  cancel-in-progress: false

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --upgrade Pillow

      - name: Converter imagens cadastradas para JPG
        run: python scripts/convert_images_to_jpg.py

      - name: Salvar JPGs e referencias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/images data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Padroniza imagens cadastradas em JPG"
            git push
          else
            echo "Todas as imagens cadastradas ja estao em JPG."
          fi
